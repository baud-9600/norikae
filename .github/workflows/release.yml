name: Release

# Pushing a v* tag builds the release APK and attaches it to a GitHub Release.
# Pushing to a branch alone does NOT produce a release — tag explicitly, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # There is no fallback key in this repo: without the secret the build would
      # produce an unsigned release, which must never be attached to a release.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # An app signed with the wrong key cannot be taken back once people have
      # installed it, so this asserts positively that the APK carries the one key
      # all of these apps are published under.
      - name: Verify the signing certificate
        env:
          EXPECTED: 311b5cbb24e690121d1d2df664cb879e7a88b74ffee5be87c897c04a59aa6665
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $digest, expected $EXPECTED."
            exit 1
          fi

      - name: Check the version matches the tag
        run: |
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::versionName is $version but the tag says $tag."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up
      # with in their downloads folder; the unversioned one exists so that
      #   .../releases/latest/download/norikae.apk
      # keeps working after the next release, which a versioned link does not.
      - name: Rename APK and generate checksum
        run: |
          apk_name="norikae-${GITHUB_REF_NAME}.apk"
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" norikae.apk
          sha256sum norikae.apk > norikae.apk.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            norikae-*.apk
            norikae-*.apk.sha256
            norikae.apk
            norikae.apk.sha256
          generate_release_notes: true
